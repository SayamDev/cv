name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Tell the profile repository that the CV changed, so its skills panel
  # redraws within a minute instead of waiting for its daily run.
  #
  # Entirely optional: without the PROFILE_SYNC_TOKEN secret this step prints a
  # note and succeeds. Deployment never depends on it.
  notify-profile:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Notify SayamDev/SayamDev
        env:
          TOKEN: ${{ secrets.PROFILE_SYNC_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "No PROFILE_SYNC_TOKEN configured."
            echo "The profile will pick this up on its next scheduled run."
            exit 0
          fi

          status=$(curl -sS -o /tmp/dispatch.log -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/SayamDev/SayamDev/dispatches \
            -d '{"event_type":"cv-updated"}')

          if [ "$status" = "204" ]; then
            echo "Profile notified — its skills panel will redraw shortly."
          else
            echo "Dispatch failed with HTTP $status:"
            cat /tmp/dispatch.log
            echo "Check that PROFILE_SYNC_TOKEN has Contents: read and write on SayamDev/SayamDev and has not expired."
            exit 1
          fi
